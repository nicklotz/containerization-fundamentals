apiVersion: apps/v1
kind: Deployment
metadata:
  name: bag-api
  namespace: bagtrack
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bag-api
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: bag-api
    spec:
      containers:
      - name: bag-api
        image: localhost:5000/bag-api:1.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: bag-api-config
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /readyz, port: 8000}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bag-api
  namespace: bagtrack
spec:
  selector:
    app: bag-api
  ports:
  - port: 8000
    targetPort: 8000
