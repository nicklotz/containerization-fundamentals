apiVersion: apps/v1
kind: Deployment
metadata:
  name: board
  namespace: bagtrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: board
  template:
    metadata:
      labels:
        app: board
    spec:
      containers:
      - name: board
        image: localhost:5000/board:1.0
        ports:
        - containerPort: 8080
        env:
        - name: BAG_API_URL
          value: http://bag-api:8000
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: board
  namespace: bagtrack
spec:
  type: LoadBalancer
  selector:
    app: board
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: board-nodeport
  namespace: bagtrack
spec:
  type: NodePort
  selector:
    app: board
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
