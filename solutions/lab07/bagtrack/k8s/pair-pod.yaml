apiVersion: v1
kind: Pod
metadata:
  name: bag-api-pair
  namespace: bagtrack
spec:
  containers:
  - name: bag-api
    image: localhost:5000/bag-api:1.0
    envFrom:
    - configMapRef:
        name: bag-api-config
  - name: scanner
    image: localhost:5000/scanner:1.0
    env:
    - name: API_URL
      value: http://localhost:8000
