apiVersion: v1
kind: Pod
metadata:
  name: bag-api-db-test
  namespace: bagtrack
spec:
  containers:
  - name: bag-api
    image: localhost:5000/bag-api:1.0
    envFrom:
    - configMapRef:
        name: bag-api-config
    - secretRef:
        name: bag-api-db
    livenessProbe:
      httpGet: {path: /healthz, port: 8000}
      periodSeconds: 10
    readinessProbe:
      httpGet: {path: /readyz, port: 8000}
      periodSeconds: 5
