apiVersion: apps/v1
kind: Deployment
metadata:
  name: bag-api
  namespace: bagtrack
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bag-api
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: bag-api
    spec:
      initContainers:
      - name: wait-for-db
        image: public.ecr.aws/docker/library/busybox:1.37
        command: ["sh", "-c", "until nc -z bagtrack-db 5432; do echo waiting for bagtrack-db; sleep 2; done"]
      containers:
      - name: bag-api
        image: localhost:5000/bag-api:1.0.2
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: bag-api-config
        - secretRef:
            name: bag-api-db
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /readyz, port: 8000}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bag-api
  namespace: bagtrack
spec:
  selector:
    app: bag-api
  ports:
  - port: 8000
    targetPort: 8000
