apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: bagtrack
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: agent
        image: public.ecr.aws/docker/library/busybox:1.37
        command: ["sh", "-c", "while true; do echo \"$(date -u +%H:%M:%S) node=$NODE_NAME pods-on-node=$(ls /host-pods | wc -l)\"; sleep 30; done"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
        volumeMounts:
        - name: pods
          mountPath: /host-pods
          readOnly: true
      volumes:
      - name: pods
        hostPath:
          path: /var/log/pods
          type: Directory
