apiVersion: v1
kind: Service
metadata:
  name: bagtrack-db
  namespace: bagtrack
spec:
  clusterIP: None
  selector:
    app: bagtrack-db
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bagtrack-db
  namespace: bagtrack
spec:
  serviceName: bagtrack-db
  replicas: 1
  selector:
    matchLabels:
      app: bagtrack-db
  template:
    metadata:
      labels:
        app: bagtrack-db
    spec:
      containers:
      - name: postgres
        image: public.ecr.aws/docker/library/postgres:17
        env:
        - name: POSTGRES_USER
          value: bagtrack
        - name: POSTGRES_DB
          value: bagtrack
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: bagtrack-db, key: password}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "bagtrack", "-d", "bagtrack"]
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
